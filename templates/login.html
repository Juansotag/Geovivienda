<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Casa en Casa — Ingresar</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="login-box">
    <img src="{{ url_for('static', filename='img/logo-casa-en-casa.png') }}" alt="Casa en Casa">
    <div class="card">
      <h2>Ingresar</h2>
      <form action="{{ url_for('clientes') }}" method="get">
        <div class="form-group">
          <label for="correo">Correo</label>
          <input type="email" id="correo" name="correo" placeholder="funcionario@casaencasa.com">
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Ingresar</button>
      </form>
    </div>
  </div>
</body>
</html>
