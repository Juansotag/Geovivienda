<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso — Geovivienda</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo-casa-en-casa.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body style="background-color: var(--color-bg);">
  <div class="login-container">
    <div class="login-card">
      <div style="display:flex; justify-content:center; margin-bottom:24px;">
        <img src="{{ url_for('static', filename='img/logo-casa-en-casa.png') }}" alt="Casa en Casa" style="width:160px; height:auto;">
      </div>

      <h2 style="margin-bottom: 20px; text-align: center;">Ingresar</h2>
      <form action="{{ url_for('clientes') }}" method="get">
        <div class="form-group">
          <label for="correo">Correo</label>
          <input type="email" id="correo" name="correo" placeholder="funcionario@casaencasa.com" required>
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:8px;">Ingresar</button>
      </form>
    </div>
  </div>
</body>
</html>
